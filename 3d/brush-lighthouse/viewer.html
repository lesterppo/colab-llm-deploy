<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lighthouse Island at Dusk — 3D Splat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a26;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 12px 14px;
    color: #fff; background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));
    pointer-events: none; }
  #hud h1 { margin: 0; font-size: 18px; }
  #hud p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  #status { margin-top: 6px; font-size: 13px; color: #ffd166; word-break: break-word; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.55)); }
  button, label.btn { pointer-events: auto; appearance: none; border: 0;
    border-radius: 999px; padding: 10px 16px; font-size: 15px;
    background: rgba(255,255,255,.92); color: #12202c; }
  button:active, label.btn:active { background: #fff; }
  #file { display: none; }
</style>
<!-- No static importmap: the script below probes several three.js hosts,
     picks the first one this device can actually reach, and injects the
     importmap pointing at it. A static jsDelivr-only importmap is exactly
     what failed on the phone (FAILED at three.js: Failed to fetch). -->
</head>
<body>
<div id="hud">
  <h1>Lighthouse Island at Dusk</h1>
  <p>Brush-trained Gaussian splat &middot; 123,025 points &middot; 30,000 steps</p>
  <p>1 finger: look around &middot; 2 fingers: move &middot; Desktop: scroll to zoom</p>
  <div id="status">Starting viewer…</div>
</div>
<div id="bar">
  <button id="reset">Reset view</button>
  <button id="spin">Spin: off</button>
  <label class="btn" for="file">Open a PLY file</label>
  <input id="file" type="file" accept=".ply,.spz,.splat,.ksplat">
</div>
<script>
  // Classic script, NOT a module: it runs even if the CDN libraries fail,
  // loads them one at a time with dynamic import() so a failure names the
  // failing step, and falls back to Spark 2.1.0 if 2.4.0 fails to import.
  // (The previous version used a static module script: a failed import
  // produced only a blank "library failed to load" with no detail.)
  const statusEl = document.getElementById("status");
  const setStatus = (t) => { statusEl.textContent = t; };
  const errText = (e) => (e && e.message) ? e.message : String(e);

  // Small Range probe: tests reachability without downloading the whole file.
  async function probe(url) {
    try {
      const r = await fetch(url, { headers: { Range: "bytes=0-1023" } });
      return r.ok || r.status === 206;
    } catch (e) { return false; }
  }
  async function firstWorking(label, urls) {
    for (const u of urls) {
      setStatus(`Checking ${label}: ${new URL(u).hostname}…`);
      if (await probe(u)) return u;
    }
    return null;
  }

  async function main() {
    // 1. Find a three.js host this device can reach (jsDelivr failed on phone).
    const threeUrl = await firstWorking("three.js host", [
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "https://unpkg.com/three@0.180.0/build/three.module.js",
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
    ]);
    if (!threeUrl) {
      setStatus("FAILED: no three.js host reachable (jsDelivr, unpkg, cdnjs all failed) — check connection, then reload.");
      return;
    }
    // cdnjs does not host three/addons, so probe addons separately.
    const passUrl = await firstWorking("three addons host", [
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/Pass.js",
      "https://unpkg.com/three@0.180.0/examples/jsm/postprocessing/Pass.js",
    ]);
    const addonsBase = passUrl
      ? passUrl.slice(0, -"postprocessing/Pass.js".length)
      : "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/";
    // Inject the importmap BEFORE any module import (a static one would
    // have locked us to jsDelivr). Spark's own imports of "three" and
    // "three/addons/..." resolve through this map.
    const im = document.createElement("script");
    im.type = "importmap";
    im.textContent = JSON.stringify({ imports: {
      "three": threeUrl,
      "three/addons/": addonsBase,
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js",
    }});
    document.head.appendChild(im);

    let THREE, sparkMod;
    try {
      setStatus("Loading three.js via " + new URL(threeUrl).hostname + "…");
      THREE = await import("three");
    } catch (e) {
      setStatus("FAILED at three.js (" + threeUrl + "): " + errText(e) + " — check connection, then reload.");
      return;
    }
    try {
      setStatus("Loading Spark 2.4.0…");
      sparkMod = await import("@sparkjsdev/spark");
    } catch (e) {
      setStatus("Spark 2.4.0 failed (" + errText(e) + ") — trying Spark 2.1.0…");
      try {
        sparkMod = await import("https://sparkjs.dev/releases/spark/2.1.0/spark.module.js");
      } catch (e2) {
        setStatus("FAILED at Spark (2.4.0 and 2.1.0): " + errText(e2) + " — check connection, then reload.");
        return;
      }
    }
    const { SparkRenderer, SplatMesh, SparkControls } = sparkMod;
    if (!SparkRenderer || !SplatMesh || !SparkControls) {
      setStatus("FAILED: Spark loaded but is missing SparkRenderer/SplatMesh/SparkControls — library version mismatch.");
      return;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1a26);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    const HOME_POS = new THREE.Vector3(4.6, 2.8, 4.6);
    const HOME_TGT = new THREE.Vector3(0, 1.0, 0);
    camera.position.copy(HOME_POS);
    camera.lookAt(HOME_TGT);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    } catch (e) {
      setStatus("FAILED creating WebGL renderer: " + errText(e) + " — this device/browser may not support WebGL2.");
      return;
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);
    const controls = new SparkControls({ canvas: renderer.domElement });

    let mesh = null, spinning = false;
    function loadMesh(opts) {
      if (mesh) { scene.remove(mesh); mesh.dispose(); }
      setStatus("Loading splat… (28 MB)");
      mesh = new SplatMesh({
        ...opts,
        onProgress: (e) => {
          if (e.total > 0) setStatus(`Loading splat… ${Math.round(e.loaded / e.total * 100)}%`);
        },
        onLoad: () => setStatus("Loaded — drag to look around."),
      });
      scene.add(mesh);
    }

    const params = new URLSearchParams(location.search);
    const PLY_URL = params.get("ply") || "https://cdn.jsdelivr.net/gh/lesterppo/colab-llm-deploy@main/3d/brush-lighthouse/lighthouse_trained.ply";
    loadMesh({ url: PLY_URL });

    document.getElementById("reset").onclick = () => {
      camera.position.copy(HOME_POS);
      camera.lookAt(HOME_TGT);
      if (mesh) mesh.rotation.set(0, 0, 0);
    };
    document.getElementById("spin").onclick = (e) => {
      spinning = !spinning;
      e.target.textContent = spinning ? "Spin: on" : "Spin: off";
    };
    document.getElementById("file").onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      setStatus(`Loading ${f.name}…`);
      loadMesh({ fileBytes: new Uint8Array(await f.arrayBuffer()), fileName: f.name });
    };

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let last = performance.now();
    renderer.setAnimationLoop(() => {
      const now = performance.now(), dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if (mesh && spinning) mesh.rotation.y += dt * 0.25;
      controls.update(camera);
      renderer.render(scene, camera);
    });
  }
  window.addEventListener("error", (e) => {
    if (!statusEl.textContent.startsWith("Loaded")) {
      setStatus("Viewer error: " + (e.message || "unknown error"));
    }
  });
  window.addEventListener("unhandledrejection", (e) => {
    if (!statusEl.textContent.startsWith("Loaded")) {
      setStatus("Viewer error: " + errText(e.reason));
    }
  });
  main();
</script>
</body>
</html>
